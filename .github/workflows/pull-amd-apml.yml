name: Pull AMD openBMC repo

on:
  schedule:
    - cron: "0 18 * * *"   # UTC 18:00 = 台灣 02:00
  workflow_dispatch:

jobs:
  pull-apml:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AMD_REPO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Test GitHub SSH
        run: |
          ssh -T git@github.com || true

      - name: Clone AMD APML repo
        run: |
          git clone --branch test ssh://git@github.com:AMDESE/OpenBMC_nda.git openBMC

      - name: Pull latest code
        run: |
          cd openBMC
          git pull origin test
          git log --oneline -5

      - name: Check APML tag
        run: |
          cd openBMC
          git tag | grep apml-5.1.1
