name: Scheduled Pull amd-health-mgr

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  pull:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AMD_REPO_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone and pull amd-health-mgr
        run: |
          git clone --branch main git@github.com:AMDESE/amd-health-mgr.git
          cd amd-health-mgr
          git pull origin main
          git log --oneline -5
